# Better Termin on a home server, published at bettertermin.com through a
# Cloudflare Tunnel.
#
# cloudflared shares the app's network namespace and reaches it on
# localhost:8000. The app listens on 127.0.0.1 only and no port is published,
# so the tunnel is the only way in and nothing is exposed on the LAN.

services:
  app:
    build: .
    # Fixed resolvers: the host's own DNS goes through Tailscale's MagicDNS, and
    # when the host's Tailscale key expired the app couldn't resolve the booking site.
    dns: [1.1.1.1, 9.9.9.9]
    env_file: .env
    environment:
      TRUST_PROXY: "1"   # trust X-Forwarded-* from 127.0.0.1 (cloudflared)
    volumes:
      - termin-data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    restart: unless-stopped

  # The tunnel token lives in cloudflared.env (not committed).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    network_mode: service:app
    env_file: cloudflared.env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [app]
    restart: unless-stopped

volumes:
  termin-data:
