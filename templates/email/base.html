<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ title }}</title>
</head>
{#- E-mail clients ignore <style> and most CSS, so this uses tables and inline styles. -#}
<body style="margin:0;padding:0;background:#f4f4f4;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;font-family:'Noto Sans',Arial,Helvetica,sans-serif;color:#3d3d3d;">

        <tr><td align="center" style="padding:0 0 18px;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td style="padding-right:12px;"><img src="cid:{{ logo_cid }}" width="44" height="44" alt="" style="display:block;border:0;"></td>
            <td style="font-style:italic;font-weight:600;color:#254c94;line-height:1.1;">
              <div style="font-size:24px;">Better Termin</div>
              <div style="font-size:15px;">Unofficial tracking site</div>
            </td>
          </tr></table>
        </td></tr>

        <tr><td style="background:#ffffff;border-top:3px solid #0a254c;">
          <div style="background:#254c94;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:16px;padding:10px 20px;">{{ title }}</div>
          <div style="padding:20px 20px 24px;font-size:16px;line-height:1.5;">
            {% block content %}{% endblock %}
          </div>
        </td></tr>

        <tr><td style="padding:16px 8px 0;font-size:12px;line-height:1.5;color:#6b6b6b;text-align:center;">
          {% block footer %}{% endblock %}
          Better Termin is not affiliated with the Städteregion Aachen or its Ausländeramt.<br>
          <a href="{{ site_url }}" style="color:#254c94;">{{ site_url }}</a>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
